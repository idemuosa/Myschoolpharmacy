services:
  # Django API Backend
  - type: web
    name: pharmacy-api
    env: python
    plan: free
    rootDir: backend
    dockerfilePath: backend/Dockerfile
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: pharmacy-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

  # Node.js Socket Server
  - type: web
    name: pharmacy-socket
    env: node
    plan: free
    rootDir: node_backend
    dockerfilePath: node_backend/Dockerfile
    buildCommand: "npm install"
    startCommand: "node server.js"
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production

  # React Frontend
  - type: static
    name: pharmacy-frontend
    env: static
    plan: free
    rootDir: pharmacy
    buildCommand: "npm install && npm run build"
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        value: https://pharmacy-api-exn3.onrender.com/api/
      - key: VITE_SOCKET_URL
        value: https://pharmacy-socket-kkpo.onrender.com

databases:
  - name: pharmacy-db
    plan: free
