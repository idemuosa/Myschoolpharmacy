services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME:-pharmacy_db}
      - POSTGRES_USER=${DB_USER:-pharmacy_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-pharmacy_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pharmacy_user} -d ${DB_NAME:-pharmacy_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - backup_volume:/backups
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-dev-key}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - DATABASE_URL=postgresql://${DB_USER:-pharmacy_user}:${DB_PASSWORD:-pharmacy_password}@db:5432/${DB_NAME:-pharmacy_db}
      - REDIS_URL=redis://redis:6379/0
      - RUN_MIGRATIONS=true
      - COLLECT_STATIC=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8000"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      - backup_volume:/backups
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-dev-key}
      - DATABASE_URL=postgresql://${DB_USER:-pharmacy_user}:${DB_PASSWORD:-pharmacy_password}@db:5432/${DB_NAME:-pharmacy_db}
      - REDIS_URL=redis://redis:6379/0
      - RUN_MIGRATIONS=false
      - COLLECT_STATIC=false
    depends_on:
      backend:
        condition: service_healthy
    command: celery -A core worker -l info
    restart: always

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-dev-key}
      - DATABASE_URL=postgresql://${DB_USER:-pharmacy_user}:${DB_PASSWORD:-pharmacy_password}@db:5432/${DB_NAME:-pharmacy_db}
      - REDIS_URL=redis://redis:6379/0
      - RUN_MIGRATIONS=false
      - COLLECT_STATIC=false
    depends_on:
      backend:
        condition: service_healthy
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: always

  frontend:
    build: 
      context: ./pharmacy
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  postgres_data:
  static_volume:
  backup_volume:
